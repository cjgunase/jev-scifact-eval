[project]
name = "jev-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
